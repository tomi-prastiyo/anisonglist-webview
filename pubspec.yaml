name: anisonglist_webview
description: "Dedicated WebView application for AniSongList."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/logo.png"
  adaptive_icon_background: "#181824"
  adaptive_icon_foreground: "assets/branding/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
